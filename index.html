<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简步数同步</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            background: #f4f7f6; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: white; 
            padding: 2.5rem 2rem; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.08); 
            width: 100%; 
            max-width: 320px; 
        }
        h2 { text-align: center; color: #333; margin-top: 0; margin-bottom: 1.5rem; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0 16px; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 14px;
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background: #28a745; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold;
            cursor: pointer; 
            transition: background 0.2s;
        }
        button:hover { background: #218838; }
        button:disabled { background: #6c757d; cursor: not-allowed; }
        #log { margin-top: 15px; font-size: 14px; color: #666; text-align: center; min-height: 20px;}
    </style>
</head>
<body>

<div class="card">
    <h2>运动步数同步</h2>
    <input type="text" id="tel" placeholder="请输入账号" />
    <input type="password" id="psw" placeholder="请输入密码" />
    <input type="number" id="step" placeholder="目标步数 (0-100000)" value="3275" />
    <button id="submitBtn" onclick="submitSteps()">一键提交</button>
    <div id="log"></div>
</div>

<script>
    // 还原完整的动态密钥
    function getFullKey() {
        const baseArr = ['fanTui2024', 'SecretKey', '1234567890', '1234567890', '1234567890', '1234567890'];
        return baseArr.join('') + '123456789012345678901234567890';
    }

    // 随机数生成
    function generateNonce() {
        return Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
    }

    // 日志打印
    function log(msg, color = "#666") {
        const logDiv = document.getElementById('log');
        logDiv.style.color = color;
        logDiv.innerText = msg;
    }

    async function submitSteps() {
        const tel = document.getElementById('tel').value.trim();
        const psw = document.getElementById('psw').value.trim();
        const step = document.getElementById('step').value.trim();
        const btn = document.getElementById('submitBtn');

        if (!tel || !psw || !step) {
            return log('⚠️ 请填写完整信息', '#dc3545');
        }

        btn.disabled = true;
        btn.innerText = "提交中...";
        log('正在生成加密签名...');

        try {
            const timestamp = Math.floor(Date.now() / 1000);
            const nonce = generateNonce();
            const fullKey = getFullKey();

            // 1. 生成防篡改签名
            const rawStr = `tel=${tel}&psw=${psw}&step=${step}&timestamp=${timestamp}&nonce=${nonce}&key=${fullKey}`;
            const signature = CryptoJS.MD5(rawStr).toString();

            // 2. 组装 Payload
            const payload = { tel, psw, step, timestamp, nonce, signature };

            // 3. AES 加密
            const aesKey = CryptoJS.enc.Utf8.parse(fullKey.slice(0, 32));
            const aesIv = CryptoJS.enc.Utf8.parse('1234567890123456');
            
            const encryptedData = CryptoJS.AES.encrypt(JSON.stringify(payload), aesKey, {
                iv: aesIv,
                mode: CryptoJS.mode.CBC,
                padding: CryptoJS.pad.Pkcs7
            }).toString();

            log('正在发送请求...');

            // 4. 发送 POST 请求
            const response = await fetch('https://step.wvuvw.top', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ encrypted_data: encryptedData })
            });

            const result = await response.json();
            
            if (result.message === 'success') {
                log('✅ 步数修改成功！', '#28a745');
            } else {
                log(`❌ 修改失败: ${result.error || '未知错误'}`, '#dc3545');
            }
        } catch (error) {
            console.error(error);
            log('❌ 网络请求异常或被拦截', '#dc3545');
        } finally {
            btn.disabled = false;
            btn.innerText = "一键提交";
        }
    }
</script>

</body>
</html>
